services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatrelay
      POSTGRES_USER: chatrelay
      POSTGRES_PASSWORD: chatrelay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatrelay"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHATRELAY_DB_URL: jdbc:postgresql://postgres:5432/chatrelay
      CHATRELAY_DB_USER: chatrelay
      CHATRELAY_DB_PASSWORD: chatrelay
    ports:
      # Bound to loopback only -- tailscale serve (already proxying HTTPS from the tailnet to
      # localhost:8080) is the sole intended entry point. Without this, "8080:8080" binds all
      # interfaces, letting any other device on the same LAN reach the app directly, bypassing
      # Tailscale entirely.
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
